stages:
  - build
  - deploy

variables:
  # 定义目标服务器信息
  REMOTE_PATH: "/home/mirrors/help"

# 构建 Docusaurus 文档
build:
  stage: build
  image: node:22
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
  before_script:
    # 配置 NPM 使用广工镜像站
    - npm config set registry https://mirrors.gdut.edu.cn/nexus/repository/npm
  script:
    - echo "Installing dependencies..."
    - npm ci
    - echo "Building Docusaurus site..."
    - npm run build
  artifacts:
    paths:
      - build/
    expire_in: 1 hour
  only:
    - main
    - master
  tags:
    - dev

# 部署到远程服务器
deploy:
  stage: deploy
  image: alpine:latest
  dependencies:
    - build
  before_script:
    # 使用教育网镜像站
    - sed -i 's#https\?://dl-cdn.alpinelinux.org/alpine#https://mirrors.cernet.edu.cn/alpine#g' /etc/apk/repositories
    # 安装 SSH 和 SCP 工具
    - apk add --no-cache openssh-client rsync
    # 配置 SSH
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    # 启动 SSH Agent
    - eval $(ssh-agent -s)
    # 添加私钥（从 GitLab CI/CD 变量中获取）
    - echo ${SSH_PRIVATE_KEY} | base64 -d > ~/.ssh/id_rsa
    - chmod 400 ~/.ssh/id_rsa
    - ssh-add ~/.ssh/id_rsa
    # 添加主机到 known_hosts（跳过主机验证或添加指纹）
    - ssh-keyscan -H $REMOTE_HOST >> ~/.ssh/known_hosts 2>/dev/null || echo "StrictHostKeyChecking no" >> ~/.ssh/config
  script:
    - echo "Preparing remote directory..."
    # 检查并创建母目录（如果不存在）
    - ssh ${REMOTE_USER}@${REMOTE_HOST} "mkdir -p ${REMOTE_PATH}" || true
    # 删除旧文档
    - ssh ${REMOTE_USER}@${REMOTE_HOST} "rm -rf ${REMOTE_PATH}/*" || true
    - echo "Deploying documentation..."
    # 使用 SCP 传输文件
    # - scp -r build/* ${REMOTE_USER}@${REMOTE_HOST}:${REMOTE_PATH}/
    # 或者使用 rsync（更高效，推荐）
    - rsync -avz --delete build/ ${REMOTE_USER}@${REMOTE_HOST}:${REMOTE_PATH}/
    - echo "Deployment completed successfully!"
  only:
    - main
    - master
  tags:
    - dev
