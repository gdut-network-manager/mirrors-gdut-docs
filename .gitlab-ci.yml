stages:
  - build
  - deploy

variables:
  # 定义目标服务器信息
  REMOTE_PATH: "/home/mirrors/help"

# 构建 Docusaurus 文档
build:
  stage: build
  image: node:22
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
  before_script:
    # 配置 NPM 使用广工镜像站
    - npm config set registry https://mirrors.gdut.edu.cn/nexus/repository/npm
  script:
    - echo "Installing dependencies..."
    - npm ci
    - echo "Building Docusaurus site..."
    - npm run build
  artifacts:
    paths:
      - build/
    expire_in: 1 hour
  only:
    - main
    - master
  tags:
    - dev

# 同步到 GitHub
github-mirror:
  stage: build
  image: alpine/git:latest
  tags:
    - dev
  before_script:
    - git config --global --add safe.directory "${CI_PROJECT_DIR}"
  script:
    - |
      if [ -z "$GITHUB_REPO" ] || [ -z "$GITHUB_TOKEN" ]; then
        echo "GITHUB_REPO or GITHUB_TOKEN is not set, skipping..."
        exit 0
      fi
    - git remote add github "https://x-access-token:${GITHUB_TOKEN}@${GITHUB_REPO#https://}"
    - git push github HEAD:${CI_COMMIT_REF_NAME} --force
  allow_failure: true
  only:
    - merge_requests
    - master
    - main
    - develop

# 部署到远程服务器
deploy:
  stage: deploy
  image: alpine:latest
  dependencies:
    - build
  before_script:
    # 使用教育网镜像站
    - sed -i 's#https\?://dl-cdn.alpinelinux.org/alpine#https://mirrors.cernet.edu.cn/alpine#g' /etc/apk/repositories
    # 安装 SSH 和 SCP 工具
    - apk add --no-cache openssh-client rsync
    # 配置 SSH
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    # 启动 SSH Agent
    - eval $(ssh-agent -s)
    # 添加私钥（从 GitLab CI/CD 变量中获取）
    - echo ${SSH_PRIVATE_KEY} | base64 -d > ~/.ssh/id_rsa
    - chmod 400 ~/.ssh/id_rsa
    - ssh-add ~/.ssh/id_rsa
    # 跳过主机验证或添加指纹
    - echo "StrictHostKeyChecking no" >> ~/.ssh/config
  script:
    # - echo "Preparing remote directory..."
    # 检查并创建母目录（如果不存在）
    # - ssh ${REMOTE_USER}@${REMOTE_HOST} "mkdir -p ${REMOTE_PATH}" || true
    # 删除旧文档
    # - ssh ${REMOTE_USER}@${REMOTE_HOST} "rm -rf ${REMOTE_PATH}/*" || true
    # - echo "Deploying documentation..."
    # 使用 SCP 传输文件
    # - scp -r build/* ${REMOTE_USER}@${REMOTE_HOST}:${REMOTE_PATH}/
    # 或者使用 rsync（更高效，推荐）
    # - rsync -avz --delete build/ ${REMOTE_USER}@${REMOTE_HOST}:${REMOTE_PATH}/
    # - echo "Deployment completed successfully!"
    - |
      # 从 GitLab CI/CD 变量中读取服务器列表（用空格或逗号分隔）
      SERVERS=$(echo $REMOTE_HOSTS | tr ',' ' ')
      
      if [ -z "$SERVERS" ]; then
        echo "❌ No servers defined in REMOTE_HOSTS variable"
        exit 1
      fi
      
      SUCCESS_COUNT=0
      FAIL_COUNT=0
      FAILED_HOSTS=""
      
      for host in $SERVERS; do
        echo ""
        echo "========================================="
        echo "📦 Deploying to: $host"
        echo "========================================="
        
        if ssh ${REMOTE_USER}@${host} "mkdir -p ${REMOTE_PATH}"; then
          rm -rf ${REMOTE_PATH}/* || true
          if rsync -avz --delete build/ ${REMOTE_USER}@${host}:${REMOTE_PATH}/; then
            echo "✅ Successfully deployed to $host"
            SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
          else
            echo "❌ Failed to rsync to $host"
            FAIL_COUNT=$((FAIL_COUNT + 1))
            FAILED_HOSTS="$FAILED_HOSTS $host"
          fi
        else
          echo "❌ Failed to prepare directory on $host"
          FAIL_COUNT=$((FAIL_COUNT + 1))
          FAILED_HOSTS="$FAILED_HOSTS $host"
        fi
      done
      
      echo ""
      echo "========================================="
      echo "📊 Deployment Summary"
      echo "========================================="
      echo "✅ Successful: $SUCCESS_COUNT"
      echo "❌ Failed: $FAIL_COUNT"
      
      if [ $FAIL_COUNT -gt 0 ]; then
        echo "Failed hosts:$FAILED_HOSTS"
        exit 1
      fi
  only:
    - main
    - master
  tags:
    - dev
