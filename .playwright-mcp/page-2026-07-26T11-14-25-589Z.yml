                  - text: "#"
              - paragraph [ref=e201]:
                - text: 本镜像仅包含 32/64 位 x86 架构处理器的软件包，在 ARM（arm64、armhf）、PowerPC（ppc64el）、RISC-V（riscv64）和 S390x 等架构的设备上（对应官方源为 ports.ubuntu.com）请使用
                - link "Ubuntu Ports 镜像使用帮助" [ref=e202] [cursor=pointer]:
                  - /url: /help/docs/mirrors/ubuntu-ports-help
                - text: 。
              - paragraph [ref=e203]:
                - text: 在 Ubuntu 24.04 之前，Ubuntu 的软件源配置文件使用传统的 One-Line-Style，路径为
                - code [ref=e204]: /etc/apt/sources.list
                - text: ；从 Ubuntu 24.04 开始，Ubuntu 的软件源配置文件变更为 DEB822 格式，路径为
                - code [ref=e205]: /etc/apt/sources.list.d/ubuntu.sources
                - text: 。
              - paragraph [ref=e206]: 可以通过以下命令查看当前系统版本：
              - generic [ref=e436]:
                - code [ref=e438]:
                  - generic [ref=e439]: cat /etc/os-release
                - button "Copy code to clipboard" [ref=e441] [cursor=pointer]
              - paragraph [ref=e212]: 输出示例：
