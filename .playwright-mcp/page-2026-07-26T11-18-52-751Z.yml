                    - /url: /help/
                - listitem [ref=f1e180]:
                  - link "各镜像源使用帮助" [ref=f1e181] [cursor=pointer]:
                    - /url: /help/docs/category/各镜像源使用帮助
                - listitem [ref=f1e182]:
                  - generic [ref=f1e183]: RubyGems 镜像使用帮助
            - generic [ref=f1e184]:
              - heading "RubyGems 镜像使用帮助" [level=1] [ref=f1e186]
              - heading [level=2] [ref=f1e187]:
                - text: 简介
                - link "Direct link to 简介" [ref=f1e188] [cursor=pointer]:
                  - /url: "#简介"
                  - text: "#"
              - paragraph [ref=f1e189]: RubyGems 是 Ruby 的包管理器，提供了 Ruby 程序和库的分发与安装。本镜像提供 RubyGems 源的缓存代理服务，加速 gem 包的下载。
              - heading [level=2] [ref=f1e190]:
                - text: 镜像信息
                - link "Direct link to 镜像信息" [ref=f1e191] [cursor=pointer]:
                  - /url: "#镜像信息"
                  - text: "#"
              - paragraph [ref=f1e192]: 本镜像提供两种访问方式，下方配置可通过下拉框按需切换：
              - table [ref=f1e193]:
                - rowgroup [ref=f1e194]:
                  - row [ref=f1e195]:
                    - columnheader "方式" [ref=f1e196]
                    - columnheader "地址" [ref=f1e197]
                - rowgroup [ref=f1e198]:
                  - row [ref=f1e199]:
                    - cell [ref=f1e200]:
                      - strong [ref=f1e201]: Nginx 缓存加速
                      - text: （推荐）
                    - cell [ref=f1e202]:
                      - code [ref=f1e203]: https://mirrors.gdut.edu.cn/rubygems/
                  - row [ref=f1e204]:
                    - cell [ref=f1e205]:
                      - strong [ref=f1e206]: Nexus 缓存代理
                    - cell [ref=f1e207]:
                      - code [ref=f1e208]: https://mirrors.gdut.edu.cn/nexus/repository/rubygems/
              - list [ref=f1e209]:
                - listitem [ref=f1e210]:
                  - strong [ref=f1e211]: 更新策略
                  - text: ：缓存代理。所有 gem 包在被请求后即会缓存到服务器，缓存 30 天。
              - heading [level=2] [ref=f1e212]:
                - text: 使用说明
                - link "Direct link to 使用说明" [ref=f1e213] [cursor=pointer]:
                  - /url: "#使用说明"
                  - text: "#"
              - generic [ref=f1e214]:
                - generic [ref=f1e215]: 镜像源
                - combobox "镜像源" [ref=f1e216] [cursor=pointer]:
                  - option "Nginx 缓存加速（推荐）" [selected]
                  - option "Nexus 缓存代理"
              - paragraph [ref=f1e217]: 以下所有配置示例均提供 Nginx 和 Nexus 两种地址，选择一种即可。切换上方的下拉框后，下方所有代码块会自动联动。
              - heading [level=3] [ref=f1e218]:
                - text: gem
                - link "Direct link to gem" [ref=f1e219] [cursor=pointer]:
                  - /url: "#gem"
                  - text: "#"
              - paragraph [ref=f1e220]: 使用以下命令替换 gem 默认源：
              - code [ref=f1e224]:
                - generic [ref=f1e225]: "# 添加镜像源并移除默认源"
                - generic [ref=f1e226]: gem sources --add https://mirrors.gdut.edu.cn/rubygems/ --remove https://rubygems.org/
                - generic [ref=f1e227]: "# 列出已有源"
                - generic [ref=f1e228]: gem sources -l
                - generic [ref=f1e229]: "# 应该只有镜像源一个"
              - paragraph [ref=f1e230]:
                - text: 或者，编辑
                - code [ref=f1e231]: ~/.gemrc
                - text: ，将镜像地址加到
                - code [ref=f1e232]: sources
                - text: 字段：
              - generic [ref=f1e233]:
                - generic [ref=f1e234]: ~/.gemrc
                - code [ref=f1e237]:
                  - generic [ref=f1e238]: "---"
                  - generic [ref=f1e239]: ":sources:"
                  - generic [ref=f1e240]: "- https://mirrors.gdut.edu.cn/rubygems/"
                  - generic [ref=f1e241]: ":update_sources: true"
                  - generic [ref=f1e242]: ":verbose: true"
                  - generic [ref=f1e243]: ":backtrace: false"
                  - generic [ref=f1e244]: ":bulk_threshold: 1000"
              - heading [level=3] [ref=f1e245]:
                - text: Bundler
                - link "Direct link to Bundler" [ref=f1e246] [cursor=pointer]:
                  - /url: "#bundler"
                  - text: "#"
              - paragraph [ref=f1e247]: 使用以下命令将 Bundler 的默认源替换为镜像源：
              - code [ref=f1e251]:
                - generic [ref=f1e252]: bundle config set --global mirror.https://rubygems.org https://mirrors.gdut.edu.cn/rubygems
              - generic [ref=f1e253]:
                - generic [ref=f1e254]: 提示
                - paragraph [ref=f1e259]:
                  - text: 配置完成后，
                  - code [ref=f1e260]: bundle install
                  - text: 会自动通过镜像源下载 gem 包。
              - heading [level=3] [ref=f1e261]:
                - text: Gemfile
                - link "Direct link to Gemfile" [ref=f1e262] [cursor=pointer]:
                  - /url: "#gemfile"
                  - text: "#"
              - paragraph [ref=f1e263]:
                - text: 在项目根目录的
                - code [ref=f1e264]: Gemfile
                - text: 中，将
                - code [ref=f1e265]: source
                - text: 直接替换为镜像地址即可：
              - generic [ref=f1e266]:
                - generic [ref=f1e267]: Gemfile
                - code [ref=f1e270]:
                  - generic [ref=f1e271]: "# 将默认源"
                  - generic [ref=f1e272]: "# source 'https://rubygems.org'"
                  - generic [ref=f1e273]: "# 替换为镜像源"
                  - generic [ref=f1e274]: source 'https://mirrors.gdut.edu.cn/rubygems/'
                  - generic [ref=f1e276]: gem 'rails'
                  - generic [ref=f1e277]: gem 'puma'
              - generic [ref=f1e278]:
                - generic [ref=f1e279]: 提示
                - paragraph [ref=f1e284]:
                  - text: 此方式仅对当前项目生效。如需全局生效，请配合
                  - link "gem" [ref=f1e285] [cursor=pointer]:
                    - /url: "#gem"
                  - text: 或
                  - link "Bundler" [ref=f1e286] [cursor=pointer]:
                    - /url: "#bundler"
                  - text: 方式使用。
              - heading [level=2] [ref=f1e287]:
                - text: 恢复默认源
                - link "Direct link to 恢复默认源" [ref=f1e288] [cursor=pointer]:
                  - /url: "#恢复默认源"
                  - text: "#"
              - paragraph [ref=f1e289]: 如果需要恢复使用官方源，执行以下命令：
              - code [ref=f1e293]:
                - generic [ref=f1e294]: "# gem (无论之前使用的是哪种镜像地址，移除时填写对应的地址即可)"
                - generic [ref=f1e295]: gem sources --remove https://mirrors.gdut.edu.cn/rubygems/ --add https://rubygems.org/
                - generic [ref=f1e297]: "# Bundler"
                - generic [ref=f1e298]: bundle config unset mirror.https://rubygems.org
              - paragraph [ref=f1e299]:
                - text: 如果使用了 Gemfile 方式，将
                - code [ref=f1e300]: Gemfile
                - text: 中的
                - code [ref=f1e301]: source
                - text: 改回
                - code [ref=f1e302]: https://rubygems.org/
                - text: 即可。
